name: Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set version from commit history
        run: node scripts/release-version.mjs --apply
      - name: Build installer
        run: npm run dist:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $assets = @(
            "dist/project-tasks-setup-$env:APP_VERSION.exe",
            "dist/project-tasks-setup-$env:APP_VERSION.exe.blockmap",
            "dist/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Мои проекты $env:APP_VERSION" --generate-notes --latest

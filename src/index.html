<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Мои проекты</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="pomodoro-bar" aria-label="Таймер Pomodoro">
      <div class="pomodoro-heading">
        <span class="tomato" aria-hidden="true">🍅</span>
        <div>
          <p id="pomodoro-phase" class="pomodoro-phase">Фокус</p>
          <div id="pomodoro-rounds" class="pomodoro-rounds" aria-label="Завершено рабочих сессий в цикле"></div>
        </div>
      </div>
      <time id="pomodoro-time" class="pomodoro-time" aria-live="polite">25:00</time>
      <div class="pomodoro-actions">
        <button id="pomodoro-toggle" class="primary" type="button">Старт</button>
        <button id="pomodoro-reset" class="secondary" type="button">Сбросить</button>
        <button id="pomodoro-skip" class="secondary" type="button">Пропустить</button>
      </div>
    </header>
    <main class="workspace">
      <section class="panel">
        <header class="panel-header">
          <div><p class="eyebrow">ТИПЫ ПРОЕКТОВ</p><h1>Разделы</h1></div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Включить тёмную тему">
            <span aria-hidden="true">🌙</span>
          </button>
        </header>
        <form id="type-form" class="add-form compact-form">
          <input id="type-input" aria-label="Название нового типа проектов" placeholder="Новый тип" autocomplete="off" />
          <button class="primary square" type="submit" aria-label="Добавить тип проектов">+</button>
        </form>
        <div id="type-list" class="type-list" role="listbox" aria-label="Типы проектов"></div>
        <div class="section-divider"></div>
        <header><p class="eyebrow">ПРОЕКТЫ</p><h2 id="type-title">Работа</h2></header>
        <form id="project-form" class="add-form">
          <input id="project-input" aria-label="Название нового проекта" placeholder="Новый проект" autocomplete="off" />
          <button class="primary square" type="submit" aria-label="Добавить проект">+</button>
        </form>
        <div id="project-list" class="list project-list" role="listbox" aria-label="Проекты"></div>
        <div class="project-empty">В этом разделе пока нет проектов</div>
        <button id="delete-project" class="danger" type="button">Удалить проект</button>
      </section>

      <section class="panel">
        <header><p class="eyebrow">ЗАДАЧИ</p><h2 id="project-title">Выберите проект</h2></header>
        <form id="task-form" class="add-form">
          <input id="task-input" aria-label="Название новой задачи" placeholder="Новая задача" autocomplete="off" disabled />
          <button id="add-task" class="primary" type="submit" disabled>Добавить</button>
        </form>
        <div id="task-list" class="list task-list" role="listbox" aria-label="Задачи"></div>
        <div class="empty-state">Выберите проект и добавьте первую задачу</div>
      </section>

      <section class="panel">
        <header><p class="eyebrow">ДЕТАЛИ ЗАДАЧИ</p></header>
        <div id="details-empty" class="empty-state details-empty">Выберите задачу, чтобы открыть её детали</div>
        <div id="details" class="details" hidden>
          <label for="task-title">Название</label>
          <input id="task-title" class="large-input" autocomplete="off" />
          <label class="check-row"><input id="task-completed" type="checkbox" /><span>Задача выполнена</span></label>
          <label for="task-comment">Комментарий</label>
          <textarea id="task-comment" placeholder="Необязательный комментарий к задаче"></textarea>
          <p id="save-status" class="save-status">Изменения сохраняются автоматически</p>
          <button id="delete-task" class="danger" type="button">Удалить задачу</button>
        </div>
      </section>
    </main>

    <dialog id="confirm-dialog">
      <form method="dialog">
        <h3 id="confirm-title">Подтвердите удаление</h3>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">Отмена</button>
          <button value="confirm" class="danger">Удалить</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
